name: Run Example Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy torch matplotlib pyyaml

      - name: Install QuantumCatch-PyTorch
        run: |
          pip install -e .

      - name: Verify import
        run: |
          python -c "import multichqc; print('QuantumCatch-PyTorch import successful')"

      - name: Run example scripts
        run: |
          for file in examples/*.py; do
            if [[ "$file" == *"spin_noise.py" ]]; then
              echo "Skipping $file (too heavy for CI)"
              continue
            fi
            echo "Running $file"
            python "$file"
          done
